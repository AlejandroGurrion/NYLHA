{% extends 'base.html' %}

{% block title %}Registrar Salida{% endblock %}

{% block content %}
<style>
    .salida-container { padding: 15px; }
    .header-rojo { 
        background-color: #f8d7da; 
        color: #561313; 
        padding: 15px; 
        text-align: center; 
        font-weight: bold;
        font-size: 20px;
        border-bottom: 2px solid #f5c6cb;
        margin: -20px -20px 20px -20px;
    }
    .search-box { display: flex; align-items: center; border: 2px solid #000; padding: 10px; margin-bottom: 15px; background: white; }
    .atrib-btn { border: 1px solid #ccc; padding: 5px 10px; margin-bottom: 10px; display: inline-block; background: #f9f9f9; }
    .grid-opciones { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    .opcion-item { 
        border: 2px solid #000; padding: 8px 12px; cursor: pointer; 
        font-weight: bold; background: white;
    }
    /* Color de selección rojo para Salida */
    .opcion-item.selected { border-color: red; color: red; background-color: #fff5f5; } 

    .color-row { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; }
    .box-color { width: 40px; height: 25px; border: 2px solid #000; cursor: pointer; }
    .box-color.selected { border: 3px solid red; }

    .cantidad-input { width: 150px; padding: 10px; border: 2px solid #ccc; font-size: 18px; margin-bottom: 15px; background: #f9f9f9; }
    .btn-confirmar-salida {
        width: 100%; background-color: #ff0000; color: white;
        padding: 15px; border: none; border-radius: 10px;
        font-size: 18px; font-weight: bold; cursor: pointer; text-transform: uppercase;
    }
</style>

<div class="header-rojo">Registrar Salida</div>

<div class="salida-container">
    <form action="{{ url_for('registrar_salida') }}" method="POST">
        <div class="search-box">
            <i class="fas fa-search" style="margin-right: 10px; color: #ccc;"></i>
            <select name="id_producto" id="select_producto" style="width:100%; border:none; font-size:18px;" required onchange="detectarCategoriaSalida()">
                <option value="">Buscar producto...</option>
                {% for prod in productos %}
                    <option value="{{ prod.id_producto }}" data-categoria="{{ prod.id_categoria }}">
                        {{ prod.nombre_prod }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="atrib-btn">Atributos</div>

        <div id="seccion_tallas" style="display: none;">
            <p><b>Talla</b></p>
            <div class="grid-opciones">
                <div class="opcion-item" onclick="selectTalla('CH', this)">CH</div>
                <div class="opcion-item" onclick="selectTalla('M', this)">M</div>
                <div class="opcion-item" onclick="selectTalla('G', this)">G</div>
                <div class="opcion-item" onclick="selectTalla('XG', this)">XG</div>
            </div>
        </div>

        <div id="seccion_tipos_taza" style="display: none;">
            <p><b>Tipo de Taza</b></p>
            <div class="grid-opciones">
                <div class="opcion-item" onclick="selectTalla('Blanca', this)">Blanca</div>
                <div class="opcion-item" onclick="selectTalla('Magica', this)">Mágica</div>
                <div class="opcion-item" onclick="selectTalla('Glitter', this)">Glitter</div>
            </div>
        </div>
        
        <div id="seccion_viniles" style="display: none;">
            <p><b>Presentación</b></p>
            <div class="grid-opciones">
                <div class="opcion-item" onclick="selectTalla('Metro', this)">Metro</div>
                <div class="opcion-item" onclick="selectTalla('Rollo', this)">Rollo</div>
                <div class="opcion-item" onclick="selectTalla('Hoja', this)">Hoja</div>
            </div>
        </div>

        <input type="hidden" name="talla_sel" id="talla_sel" required>

        <p><b>Color / Acabado</b></p>
        <div class="color-row">
            <div class="box-color" style="background: black;" onclick="selectColor('Negro', this)"></div>
            <div class="box-color" style="background: blue;" onclick="selectColor('Azul', this)"></div>
            <div class="box-color" style="background: white;" onclick="selectColor('Blanco', this)"></div>
            <div class="box-color" style="background: red;" onclick="selectColor('Rojo', this)"></div>
            <div class="box-color" style="background: #ffd700;" onclick="selectColor('Dorado', this)"></div>
            <div class="box-color" style="background: #c0c0c0;" onclick="selectColor('Plateado', this)"></div>
            <div class="box-color" style="background: #ffc0cb;" onclick="selectColor('Rosa', this)"></div>
        </div>
        <input type="hidden" name="color_sel" id="color_sel" required>

        <p><b>Cantidad de salida</b></p>
        <input type="number" name="cantidad" class="cantidad-input" placeholder="0 Uds" required min="1">

        <button type="submit" class="btn-confirmar-salida">CONFIRMAR SALIDA</button>
    </form>
</div>

<script>
    function detectarCategoriaSalida() {
        var select = document.getElementById("select_producto");
        var categoria = select.options[select.selectedIndex].getAttribute("data-categoria");
        
        var divTallas = document.getElementById("seccion_tallas"); 
        var divTazas = document.getElementById("seccion_tipos_taza");
        var divViniles = document.getElementById("seccion_viniles");

        document.getElementById('talla_sel').value = "";
        document.querySelectorAll('.opcion-item').forEach(i => i.classList.remove('selected'));

        divTallas.style.display = "none";
        divTazas.style.display = "none";
        divViniles.style.display = "none";

        if (categoria == "1") { // Textiles
            divTallas.style.display = "block";
        } else if (categoria == "2") { // Cerámicos
            divTazas.style.display = "block";
        } else if (categoria == "3") { // Viniles
            divViniles.style.display = "block";
        }
    }

    function selectTalla(valor, elemento) {
        document.querySelectorAll('.opcion-item').forEach(i => i.classList.remove('selected'));
        elemento.classList.add('selected');
        document.getElementById('talla_sel').value = valor;
    }

    function selectColor(color, elemento) {
        document.querySelectorAll('.box-color').forEach(i => i.classList.remove('selected'));
        elemento.classList.add('selected');
        document.getElementById('color_sel').value = color;
    }
</script>
{% endblock %}
